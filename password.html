<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesuatu Untuk Kamu ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at top, #432344 0%, #1b101d 50%, #08080c 100%);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden;
        }

        .container {
            position: relative;
            z-index: 5;
            width: 90%;
            max-width: 500px;
            padding: 35px 25px;
            animation: muncul 2s ease;
        }

        .heart {
            font-size: 75px;
            animation: heartbeat 1.3s infinite;
        }

        h1 {
            font-size: 32px;
            margin: 20px 0 10px;
        }

        p {
            color: #dddddd;
            font-size: 18px;
            line-height: 1.7;
        }

        .hint {
            margin-top: 25px;
            font-size: 15px;
            color: #aaaaaa;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            border: none;
            border-radius: 30px;
            outline: none;
            text-align: center;
            font-size: 17px;
        }

        button {
            margin-top: 18px;
            padding: 14px 30px;
            border: none;
            border-radius: 30px;
            background: white;
            color: #17101c;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 30px rgba(255,255,255,0.35);
        }

        #pesan {
            min-height: 25px;
            margin-top: 18px;
            color: #ffb6c1;
            font-size: 15px;
        }

        .hearts {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .hearts span {
            position: absolute;
            bottom: -50px;
            font-size: 25px;
            animation: naik 8s linear infinite;
        }

        .hearts span:nth-child(1) {
            left: 10%;
        }

        .hearts span:nth-child(2) {
            left: 30%;
            animation-delay: 2s;
        }

        .hearts span:nth-child(3) {
            left: 55%;
            animation-delay: 4s;
        }

        .hearts span:nth-child(4) {
            left: 80%;
            animation-delay: 1s;
        }

        @keyframes muncul {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        @keyframes naik {
            from {
                transform: translateY(0);
                opacity: 0;
            }

            15% {
                opacity: 1;
            }

            to {
                transform: translateY(-110vh);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="hearts">
        <span>❤️</span>
        <span>💕</span>
        <span>💗</span>
        <span>💖</span>
    </div>

    <div class="container">

        <div class="heart">❤️</div>

        <h1>Ada sesuatu untuk kamu...</h1>

        <p>
            Sebelum membuka kejutan ini,
            ada satu hal yang harus kamu ingat. ❤️
        </p>

        <p class="hint">
            Masukkan tanggal yang hanya kita tahu...
        </p>

        <input
            type="password"
            id="password"
            placeholder="Masukkan password ❤️"
        >

        <br>

        <button onclick="cekPassword()">
            Buka Kejutan ❤️
        </button>

        <div id="pesan"></div>

    </div>

    <script>
        function cekPassword() {

            const password = document.getElementById("password").value;

            if (password === "16.09.2026") {
                window.location.href = "index.html";
            } else {
                document.getElementById("pesan").innerHTML =
                    "Hmm... sepertinya belum tepat ❤️";
            }
        }
    </script>

</body>
</html>
